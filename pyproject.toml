[project]
name = "clef-logo"
version = "0.1.0"
description = "中音谱号个人 Logo 探索（matplotlib + Jupyter）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "nbconvert>=7.16",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
